apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-reports-api
  namespace: reports
  labels:
    app: staging-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-reports
  template:
    metadata:
      labels:
        app: staging-reports
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: reports-api
          image: prophazedocker/staging-report:latest   # Jenkins will replace this
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: reports-config
            - secretRef:
                name: reports-secrets
          args:
            - --log-level=debug
            - --scheme=http
            - --port=8000
            - --host=0.0.0.0
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: staging-reports
  namespace: reports
  labels:
    app: staging-reports
spec:
  selector:
    app: staging-reports
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31000
  type: NodePort
